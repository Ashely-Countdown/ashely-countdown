<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Countdown">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3a2352">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>Countdown</title>
<style>
:root{--sky1:#3a2352;--sky2:#c0516f;--sky3:#ffb38a;--ink:#fff6f0;--soft:#ffd9dc;--glass:rgba(255,246,240,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#241539;--sky2:#9e3f60;--sky3:#e8946e}}
:root[data-theme="dark"]{--sky1:#241539;--sky2:#9e3f60;--sky3:#e8946e}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--sky2) linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,var(--sky3) 100%) fixed}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
background:none;
display:flex;justify-content:center;overflow-x:hidden}
main{width:100%;max-width:440px;padding:36px 22px 48px;text-align:center}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:1.7rem;line-height:1.25;margin:0 0 6px}
.sub{color:var(--soft);margin:0 0 22px}
.big{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.days{font-family:Georgia,"Times New Roman",serif;font-size:7.5rem;line-height:1;display:block}
.dl{font-size:1.1rem;color:var(--soft)}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.u{background:var(--glass);border-radius:18px;padding:12px 4px}
.u b{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:1.7rem}
.u span{font-size:.85rem;color:var(--soft)}
svg{width:100%;height:auto;overflow:visible;margin-top:6px}
.lbl{font-size:.85rem;color:var(--soft);display:flex;justify-content:space-between;padding:0 6px}
.note{margin-top:26px;background:var(--glass);border-radius:18px;padding:22px 20px}
.note p{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.2rem;line-height:1.5}
.tip{margin:22px 0 0;font-size:.85rem;color:var(--soft)}
.note .by{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:.9rem;color:var(--soft);margin-top:12px}
.heart{position:fixed;pointer-events:none;font-size:1.6rem;animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translateY(-220px) scale(1.3);opacity:0}}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.heart{animation:none;opacity:0}}
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">Open this page in Safari or Chrome to see the countdown.</p></noscript>
<main>
<h1>Days left until we meet again</h1>
<p class="sub">December 5th. Not long now.</p>

<button class="big" id="tap" aria-label="Send a heart">
<span class="days" id="d">0</span>
<span class="dl" id="dl">days</span>
</button>

<div class="units">
<div class="u"><b id="h">0</b><span>hours</span></div>
<div class="u"><b id="m">0</b><span>minutes</span></div>
<div class="u"><b id="s">0</b><span>seconds</span></div>
</div>

<svg viewBox="0 0 360 130" aria-hidden="true">
<path id="arc" d="M20 115 Q180 -35 340 115" fill="none" stroke="rgba(255,246,240,.55)" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
<circle cx="20" cy="115" r="5" fill="#fff6f0"/>
<text id="pl" font-size="26" text-anchor="middle" dominant-baseline="central">✈️</text>
<text x="340" y="119" font-size="22" text-anchor="middle" dominant-baseline="central">🏡</text>
</svg>
<div class="lbl"><span id="sh">Shanghai</span><span>Toronto, Dec 5th</span></div>

<div class="note"><p id="q"></p><p class="by" id="by"></p></div>
<p class="tip" id="tip" hidden>Tip: tap the Share button, then Add to Home Screen.</p>
</main>

<script>
(function(){
var END=Date.UTC(2026,11,5,5,0,0);      // Dec 5, 2026, 00:00 Toronto time
var START=Date.UTC(2026,9,1,4,0,0);     // Oct 1, 2026
var $=function(i){return document.getElementById(i)};
var arc=$("arc"),L=arc.getTotalLength(),pl=$("pl");
function place(p){
  var a=arc.getPointAtLength(L*p),b=arc.getPointAtLength(Math.min(L,L*p+1));
  var ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  pl.setAttribute("transform","translate("+a.x+" "+a.y+") rotate("+(ang-45+ 0)+")");
}
function shDate(){
  try{
    var f=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Shanghai",month:"short",day:"numeric"}).formatToParts(new Date()),mo="",dy=0;
    f.forEach(function(x){if(x.type==="month")mo=x.value;if(x.type==="day")dy=parseInt(x.value,10)});
    var suf=(dy%100>=11&&dy%100<=13)?"th":({1:"st",2:"nd",3:"rd"}[dy%10]||"th");
    $("sh").textContent="Shanghai, "+mo+" "+dy+suf;
  }catch(e){}
}
function tick(){
  shDate();
  var now=Date.now(),t=END-now;
  if(t<=0){
    $("d").textContent="0";$("dl").textContent="You're home, Ashely!";
    $("h").textContent=$("m").textContent=$("s").textContent="0";place(1);return;
  }
  var d=Math.floor(t/864e5),h=Math.floor(t%864e5/36e5),m=Math.floor(t%36e5/6e4),s=Math.floor(t%6e4/1e3);
  $("d").textContent=d;$("dl").textContent=d===1?"day":"days";
  $("h").textContent=h;$("m").textContent=m;$("s").textContent=s;
  place(Math.min(1,Math.max(0,(now-START)/(END-START))));
}
tick();setInterval(tick,1000);
var ios=/iPhone|iPad|iPod/.test(navigator.userAgent),sa=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
if(ios&&!sa)$("tip").hidden=false;
$("tap").addEventListener("click",function(e){
  for(var i=0;i<6;i++){
    var el=document.createElement("div");el.className="heart";
    el.textContent=["💗","💕","💖","❤️"][i%4];
    el.style.left=(e.clientX-14+(Math.random()*80-40))+"px";
    el.style.top=(e.clientY-14)+"px";
    el.style.animationDelay=(i*0.08)+"s";
    document.body.appendChild(el);
    setTimeout(function(x){x.remove()},2000,el);
  }
});
var Q=[["The journey of a thousand li commenced with a single step.", "Lao Tzu"], ["The impediment to action advances action. What stands in the way becomes the way.", "Marcus Aurelius"], ["There are more things, Lucilius, likely to frighten us than there are to crush us; we suffer more often in imagination than in reality.", "Seneca"], ["Men are disturbed, not by things, but by the principles and notions which they form concerning things.", "Epictetus"], ["For as it is not one swallow or one fine day that makes a spring, so it is not one day or a short time that makes a man blessed and happy.", "Aristotle"], ["He who has a why to live for can bear almost any how.", "Friedrich Nietzsche"], ["In the midst of winter, I found there was, within me, an invincible summer.", "Albert Camus"], ["It is perfectly true, as philosophers say, that life must be understood backwards. But they forget the other proposition, that it must be lived forwards.", "Søren Kierkegaard"], ["Is it not pleasant to learn with a constant perseverance and application? Is it not delightful to have friends coming from distant quarters?", "Confucius"], ["The unexamined life is not worth living.", "Socrates"], ["Very little is needed to make a happy life; it is all within yourself, in your way of thinking.", "Marcus Aurelius"], ["It is difficulties that show what men are.", "Epictetus"], ["Wonder is the feeling of a philosopher, and philosophy begins in wonder.", "Plato"], ["One must still have chaos in oneself to be able to give birth to a dancing star.", "Friedrich Nietzsche"], ["The struggle itself toward the heights is enough to fill a man's heart. One must imagine Sisyphus happy.", "Albert Camus"], ["Begin at once to live, and count each separate day as a separate life.", "Seneca"], ["Of all the things which wisdom provides to make life entirely happy, much the greatest is the possession of friendship.", "Epicurus"], ["Waste no more time arguing about what a good man should be. Be one.", "Marcus Aurelius"], ["Nothing can bring you peace but yourself. Nothing can bring you peace but the triumph of principles.", "Ralph Waldo Emerson"], ["Trust thyself: every heart vibrates to that iron string.", "Ralph Waldo Emerson"], ["No good thing is pleasant to possess, without friends to share it.", "Seneca"], ["He who knows other men is discerning; he who knows himself is intelligent. He who overcomes others is strong; he who overcomes himself is mighty.", "Lao Tzu"], ["Nothing great was ever achieved without enthusiasm.", "Ralph Waldo Emerson"], ["No man ever steps in the same river twice, for it is not the same river and he is not the same man.", "Heraclitus"], ["Sometimes even to live is an act of courage.", "Seneca"], ["Blessedness is not the reward of virtue, but virtue itself; neither do we rejoice therein because we control our lusts, but, contrariwise, because we rejoice therein, we are able to control our lusts.", "Baruch Spinoza"], ["Loss is nothing else but change, and change is Nature's delight.", "Marcus Aurelius"], ["To see what is right and not to do it is want of courage.", "Confucius"], ["Without music, life would be a mistake.", "Friedrich Nietzsche"], ["If one advances confidently in the direction of his dreams, and endeavors to live the life which he has imagined, he will meet with a success unexpected in common hours.", "Henry David Thoreau"], ["Things do not change; we change.", "Henry David Thoreau"], ["He suffers more than necessary who suffers before it is necessary.", "Seneca"], ["The beginning is the most important part of any work.", "Plato"], ["First say to yourself what you would be; and then do what you have to do.", "Epictetus"], ["Such as are thy habitual thoughts, such also will be the character of thy mind; for the soul is dyed by the thoughts.", "Marcus Aurelius"], ["Let no one be slow to seek wisdom when he is young, nor weary in the search of it when he is grown old.", "Epicurus"], ["Real generosity toward the future lies in giving all to the present.", "Albert Camus"], ["It is not enough to have a good mind; the main thing is to use it well.", "René Descartes"], ["The good life is one inspired by love and guided by knowledge.", "Bertrand Russell"], ["The heart has its reasons which reason knows nothing of.", "Blaise Pascal"], ["Sapere aude! Have courage to use your own understanding!", "Immanuel Kant"], ["Gratitude is not only the greatest of virtues, but the parent of all the others.", "Cicero"], ["Believe that life is worth living, and your belief will help create the fact.", "William James"], ["Whoever fights monsters should see to it that in the process he does not become a monster.", "Friedrich Nietzsche"], ["It is not that we have a short time to live, but that we waste a lot of it.", "Seneca"], ["To be great is to be misunderstood.", "Ralph Waldo Emerson"], ["It is not death that a man should fear, but he should fear never beginning to live.", "Marcus Aurelius"], ["Anxiety is the dizziness of freedom.", "Søren Kierkegaard"], ["While we are postponing, life speeds by.", "Seneca"], ["When I dance, I dance; when I sleep, I sleep.", "Michel de Montaigne"], ["The greatest thing in the world is to know how to belong to oneself.", "Michel de Montaigne"], ["Nothing is miserable unless you think it so; and on the contrary, every lot is happy if borne with equanimity.", "Boethius"], ["Take away thy opinion, and then there is taken away the complaint, ‘I have been harmed.’ Take away the complaint, and the harm is taken away.", "Marcus Aurelius"], ["Be a philosopher; but, amidst all your philosophy, be still a man.", "David Hume"], ["Live in each season as it passes; breathe the air, drink the drink, taste the fruit, and resign yourself to the influences of each.", "Henry David Thoreau"], ["Write it on your heart that every day is the best day in the year.", "Ralph Waldo Emerson"], ["Attention is the rarest and purest form of generosity.", "Simone Weil"], ["If you wish to improve, be content to be thought foolish and stupid.", "Epictetus"], ["The desire and pursuit of the whole is called love.", "Plato"], ["The superior man is satisfied and composed; the mean man is always full of distress.", "Confucius"], ["Do not act as if thou wert going to live ten thousand years. While it is in thy power, be good.", "Marcus Aurelius"], ["The cost of a thing is the amount of what I will call life which is required to be exchanged for it, immediately or in the long run.", "Henry David Thoreau"], ["Of things some are in our power, and others are not.", "Epictetus"], ["Do the thing, and you shall have the power.", "Ralph Waldo Emerson"]],SP={"1": "Tomorrow.", "2": "Two more sleeps.", "3": "Three days. You're almost here.", "4": "Four days left.", "5": "Five days. The finish line is in sight.", "6": "Six days. Nearly there.", "7": "One week left."};
var left=Math.ceil((END-Date.now())/864e5),sp=left<=0?"You're home.":SP[left],qq=Q[Math.min(Q.length-1,Math.max(0,66-left))];
$("q").textContent=sp?sp:"“"+qq[0]+"”";$("by").textContent=sp?"":"- "+qq[1];
})();
</script>
</body>
</html>
